name: Publish AsyncGEPA

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-ci:
    if: github.repository == 'DGoettlich/async-gepa'
    uses: ./.github/workflows/run_tests.yml

  publish:
    needs: [verify-ci]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Verify release tag
        run: |
          git merge-base --is-ancestor HEAD origin/main
          uv run --no-project python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          assert os.environ["GITHUB_REF_NAME"] == f"v{version}"
          PY
      - name: Install build tools
        run: uv sync --locked --extra build
      - name: Build distributions
        run: uv run --no-sync python -m build
      - name: Check package metadata
        run: uv run --no-sync python -m twine check --strict dist/*
      - name: Verify installed wheel
        run: |
          uv venv "$RUNNER_TEMP/package-check"
          uv pip install --python "$RUNNER_TEMP/package-check/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          uv run --no-project --no-sync --python "$RUNNER_TEMP/package-check/bin/python" python - <<'PY'
          import os
          from importlib.metadata import version

          from async_gepa import AsyncGEPAAdapter, optimize
          from async_gepa.strategies.scheduling import ContinuousRollouts

          assert version("async-gepa") == os.environ["GITHUB_REF_NAME"][1:]
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
